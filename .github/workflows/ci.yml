name: StudyFlow CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.0'
          package-manager-cache: false
      - name: Dependencias Flutter bloqueadas
        run: flutter pub get --enforce-lockfile
      - name: Análisis estático
        run: flutter analyze --no-pub
      - name: Pruebas Flutter
        run: flutter test --no-pub --reporter expanded
      - name: Pruebas del servidor
        run: node --test server/test/*.test.js
      - name: Auditoría básica de secretos
        shell: bash
        run: |
          if git grep -nE '(sk-[A-Za-z0-9_-]{20,}|OPENAI_API_KEY=(sk-|[A-Za-z0-9_-]{20,}))' -- ':!*.example'; then
            echo 'Se encontró un posible secreto'
            exit 1
          fi
