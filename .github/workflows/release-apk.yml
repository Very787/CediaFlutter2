name: StudyFlow Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  construir:
    needs: calidad
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Construir APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'http://10.0.2.2:8080' }}
        run: flutter build apk --release --no-pub --dart-define="API_BASE_URL=$API_BASE_URL"
      - uses: actions/upload-artifact@v7
        with:
          name: studyflow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  publicar:
    needs: construir
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: studyflow-apk
          path: apk
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" apk/app-release.apk --verify-tag --title "StudyFlow IA $RELEASE_TAG" --notes "APK académico de StudyFlow IA."
